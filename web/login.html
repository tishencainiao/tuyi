<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 途忆</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <div class="auth-brand">
      <span class="logo">忆</span>
      <div>
        <strong>途忆</strong>
        <small>基于大语言模型的个性化旅游攻略</small>
      </div>
    </div>

    <section class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">登录</button>
        <button type="button" class="auth-tab" data-mode="register">注册</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>用户名 <input id="login-username" autocomplete="username" placeholder="例如 test1" /></label>
        <label>密码 <input id="login-password" type="password" autocomplete="current-password" placeholder="至少 6 位" /></label>
        <button type="submit">登录</button>
      </form>

      <form id="register-form" class="auth-form" style="display:none">
        <label>用户名 <input id="reg-username" autocomplete="username" placeholder="2~20 个字符" /></label>
        <label>密码 <input id="reg-password" type="password" autocomplete="new-password" placeholder="至少 6 位" /></label>
        <button type="submit">注册并登录</button>
      </form>

      <p id="auth-error" class="auth-error"></p>
      <p class="auth-hint">测试账户：test1 / test2 / test3，密码都是 123456</p>
    </section>
  </main>

  <script src="/login.js"></script>
</body>
</html>
