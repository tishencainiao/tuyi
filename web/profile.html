<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人中心 · 途忆</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">忆</span>
      <div>
        <strong>途忆</strong>
        <small>基于大语言模型的个性化旅游攻略</small>
      </div>
    </div>
    <nav class="nav">
      <a href="/">聊天</a>
      <a href="/dashboard.html">偏好统计</a>
      <a href="/profile.html" class="active">个人中心</a>
    </nav>
  </header>

  <main class="page">
    <div class="page-head">
      <h1>个人中心</h1>
      <p class="muted">查看某位用户的偏好画像、记忆条目与行程记录（默认取当前浏览器的用户 ID）。</p>
    </div>

    <div class="profile-bar">
      <input id="uid" type="text" placeholder="用户 ID，例如 live-test" />
      <button id="load" type="button">加载</button>
    </div>

    <div id="profile-body" class="profile-body"></div>
  </main>

  <script src="/profile.js"></script>
</body>
</html>
