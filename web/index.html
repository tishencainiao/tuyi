<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>途忆 · 个性化旅游攻略</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">忆</span>
      <div>
        <strong>途忆</strong>
        <small>基于大语言模型的个性化旅游攻略</small>
      </div>
    </div>
    <nav class="nav">
      <a href="/" class="active">聊天</a>
      <a href="/dashboard.html">偏好统计</a>
      <a href="/profile.html">个人中心</a>
    </nav>
  </header>

  <main class="chat">
    <div id="messages" class="messages">
      <div class="msg bot">
        <div class="bubble">你好，我是途忆，也可以叫我小忆。告诉我你想去哪、玩几天、和谁一起、预算大概多少，我来帮你排一份能直接用的行程。</div>
      </div>
      <div class="chips" id="chips">
        <button type="button" class="chip" data-prompt="带爸妈去成都玩三天，预算中等，不想太累">带爸妈 · 成都三天</button>
        <button type="button" class="chip" data-prompt="一个人去苏州过周末，预算 1500，喜欢园林和美食">独自 · 苏州周末</button>
        <button type="button" class="chip" data-prompt="和女朋友去云南五天，预算 5000，喜欢自然风光">两人 · 云南五天</button>
      </div>
    </div>

    <div id="hint" class="hint" aria-live="polite"></div>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="说说出游需求，例如：下个月带爸妈去成都玩 3 天，预算中等，不想太累"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
